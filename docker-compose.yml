services:
  lithophane:
    image: ${LITHOPHANE_IMAGE}
    container_name: ${LITHOPHANE_CONTAINER_NAME:-lithophane}
    hostname: ${LITHOPHANE_HOSTNAME:-lithophane}
    pull_policy: always
    restart: unless-stopped
    networks:
      VLAN50_Docker:
        ipv4_address: 10.10.50.19
    dns:
      - ${LITHOPHANE_DNS}
    environment:
      TZ: ${TZ}
      PYTHONUNBUFFERED: "1"
    expose:
      - "8000"
    mem_limit: ${LITHOPHANE_MEM_LIMIT:-1g}
    mem_reservation: ${LITHOPHANE_MEM_RESERVATION:-256m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${DOCKER_NETWORK}
      - traefik.http.routers.lithophane.rule=Host(`${LITHOPHANE_DOMAIN}`)
      - traefik.http.routers.lithophane.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.lithophane.tls=true
      - traefik.http.routers.lithophane.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.lithophane.loadbalancer.server.port=8000
      - traefik.http.services.lithophane.loadbalancer.server.scheme=http
      - traefik.http.services.lithophane.loadbalancer.healthcheck.path=/api/health
      - traefik.http.services.lithophane.loadbalancer.healthcheck.interval=15s

networks:
  VLAN50_Docker:
    external: true
    name: ${DOCKER_NETWORK}
